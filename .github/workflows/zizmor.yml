# Static security analysis of the GitHub Actions workflows (zizmor, https://docs.zizmor.sh).
# Annotations mode: findings show inline on the pull request and fail the job; no code scanning upload, so pull
# requests from forks need no write permission.
name: zizmor

on:
  push:
    branches: [main]
    paths:
      - .github/**
  pull_request:
    paths:
      - .github/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          version: 1.30.1
